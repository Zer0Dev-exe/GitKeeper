[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitkeeper"
version = "0.1.0"
description = "CLI + TUI para gestionar tus repositorios de GitHub, GitLab y Bitbucket, con descripciones generadas por IA."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.27.3",
    "rich>=15.0.0",
    "httpx>=0.28.1",
    "textual>=8.2.8",
    "tomli-w>=1.2.0",
    "platformdirs>=4.12.4",
]

[project.optional-dependencies]
claude = ["anthropic>=1.13.0"]
gemini = ["google-genai>=1.0"]
openai = ["openai>=3.28.0"]
ai = ["anthropic>=1.13.0", "google-genai>=1.0", "openai>=3.28.0"]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "respx>=0.21"]

[project.scripts]
gitkeeper = "gitkeeper.cli:main"
gk = "gitkeeper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gitkeeper = ["tui/*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
