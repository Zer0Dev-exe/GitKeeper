[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitkeeper"
version = "0.1.0"
description = "CLI + TUI para gestionar tus repositorios de GitHub, GitLab y Bitbucket, con descripciones generadas por IA."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "textual>=0.80",
    "tomli-w>=1.0",
    "platformdirs>=4",
]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
gemini = ["google-genai>=1.0"]
openai = ["openai>=1.40"]
ai = ["anthropic>=1.0", "google-genai>=1.0", "openai>=1.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
gitkeeper = "gitkeeper.cli:main"
gk = "gitkeeper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gitkeeper = ["tui/*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
